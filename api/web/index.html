<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>構成ドリフトの申告・承認</title>
<style nonce="__NONCE__">
  :root { color-scheme: light dark; --bg:#f6f7f9; --card:#fff; --text:#1f2933; --sub:#52606d; --line:#d9dee4;
          --accent:#0b6bcb; --danger:#c62828; --ok:#1b7f3b; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14181c; --card:#1e242b; --text:#e6e9ec; --sub:#9aa5b1;
          --line:#323b45; --accent:#5aa9f0; --danger:#ff8a80; --ok:#6fd08c; } }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--text);
         font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; line-height:1.7; }
  main { max-width:720px; margin:0 auto; }
  h1 { font-size:1.25rem; margin:8px 0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
  .row { display:flex; gap:12px; padding:6px 0; border-bottom:1px solid var(--line); }
  .row:last-child { border-bottom:none; }
  .label { flex:0 0 7.5em; color:var(--sub); font-size:.9rem; }
  .value { flex:1; word-break:break-all; white-space:pre-wrap; }
  button { font:inherit; padding:10px 18px; border-radius:8px; border:1px solid var(--accent);
           background:var(--accent); color:#fff; cursor:pointer; }
  button.sub { background:transparent; color:var(--accent); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  textarea, input[type=text] { width:100%; font:inherit; padding:8px; border-radius:8px; border:1px solid var(--line);
           background:var(--bg); color:var(--text); }
  .msg { padding:10px 12px; border-radius:8px; margin-top:12px; border:1px solid var(--line); }
  .msg.ok { border-color:var(--ok); color:var(--ok); }
  .msg.err { border-color:var(--danger); color:var(--danger); }
  .item { display:block; width:100%; text-align:left; margin:0 0 8px; padding:10px 12px; border:1px solid var(--line);
          border-radius:8px; background:var(--bg); color:var(--text); }
  .item:hover { border-color:var(--accent); }
  .item .top { display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; }
  .item .sub-text { color:var(--sub); font-size:.9rem; word-break:break-all; }
  .chip { font-size:.8rem; padding:0 8px; border-radius:999px; border:1px solid var(--line); white-space:nowrap; }
  .chip.DETECTED { border-color:var(--danger); color:var(--danger); }
  .chip.ATTESTED { border-color:var(--accent); color:var(--accent); }
  .chip.APPROVED { border-color:var(--ok); color:var(--ok); }
  .quote { border-left:4px solid var(--accent); padding:8px 12px; margin:8px 0 0; white-space:pre-wrap; word-break:break-all; }
  .who { color:var(--sub); font-size:.9rem; display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; }
  .status { font-weight:bold; }
  [hidden] { display:none !important; }
</style>
</head>
<body data-config="__CONFIG__">
<main>
  <h1>構成ドリフトの申告・承認</h1>

  <section id="login" class="card" hidden>
    <p>変更の内容を見て、申告や承認をするには、ログインが必要です。</p>
    <button id="login-btn" type="button">ログインして続ける</button>
  </section>

  <section id="app" hidden>
    <div class="who card">
      <span>ログイン中: <strong id="who-email"></strong>（グループ: <span id="who-groups"></span>）</span>
      <button id="logout-btn" type="button" class="sub">ログアウト</button>
    </div>

    <section id="list" class="card" hidden>
      <h2 style="font-size:1.05rem;margin-top:0">最近の検知</h2>
      <div id="list-body"></div>
      <details>
        <summary>通知のIDで開く</summary>
        <p><input id="event-input" type="text" placeholder="通知のID（例: e390737a-d4b0-5910-9218-776ad4a054b9）"></p>
        <p><button id="open-btn" type="button">開く</button></p>
      </details>
    </section>

    <p id="backbar" hidden><button id="back-btn" type="button" class="sub">← 一覧に戻る</button></p>

    <section id="event" class="card" hidden>
      <div id="detail"></div>
    </section>

    <section id="mine" class="card" hidden>
      <h2 style="font-size:1.05rem;margin-top:0">あなたが申告しました</h2>
      <p style="margin-bottom:0">あなたが入力した理由:</p>
      <p id="mine-reason" class="quote"></p>
    </section>

    <section id="note" class="card" hidden>
      <p id="note-text" style="margin:0"></p>
    </section>

    <section id="attest" class="card" hidden>
      <h2 style="font-size:1.05rem;margin-top:0">申告する</h2>
      <p>この変更を自分で行った場合だけ、理由を書いて申告できます。</p>
      <textarea id="reason" rows="4" placeholder="変更した理由"></textarea>
      <p><button id="attest-btn" type="button">申告する</button></p>
    </section>

    <section id="approve" class="card" hidden>
      <h2 style="font-size:1.05rem;margin-top:0">承認する</h2>
      <p>申告者より権限が高い人だけが承認できます（申告者本人は承認できません）。</p>
      <p><button id="approve-btn" type="button">承認する</button></p>
    </section>

    <div id="message" class="msg" hidden></div>
  </section>

  <p id="fatal" class="msg err" hidden></p>
</main>

<script nonce="__NONCE__">
(() => {
  'use strict';
  const cfg = JSON.parse(document.body.dataset.config);
  const $ = (id) => document.getElementById(id);
  const store = window.sessionStorage;
  const EVENT_ID = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
  // このページは /{stage}/ui にある。APIは同じ場所の /{stage}/... にある
  const apiBase = location.pathname.replace(/\/ui\/?$/, '');
  let eventId = null;

  // ---- 表示のための小さな部品（外から来た文字は、必ず textContent で入れる）----
  const show = (id, on) => { $(id).hidden = !on; };
  const showMessage = (text, ok) => {
    const el = $('message'); el.textContent = text; el.className = 'msg ' + (ok ? 'ok' : 'err'); el.hidden = false;
  };
  const fatal = (text) => { const el = $('fatal'); el.textContent = text; el.hidden = false; };

  const b64url = (bytes) => btoa(String.fromCharCode(...bytes)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  const randomString = (n) => b64url(crypto.getRandomValues(new Uint8Array(n)));
  const sha256 = async (text) => new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)));

  const parseJwt = (token) => {
    let p = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
    p += '='.repeat((4 - (p.length % 4)) % 4);
    return JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(p), (c) => c.charCodeAt(0))));
  };

  const clearSession = () => { ['id_token', 'pkce_verifier', 'oauth_state'].forEach((k) => store.removeItem(k)); };
  const validToken = () => {
    const t = store.getItem('id_token');
    if (!t) return null;
    try { return parseJwt(t).exp * 1000 > Date.now() + 30000 ? t : null; } catch { return null; }
  };

  // ---- ログイン（Cognito。Authorization Code + PKCE）----
  const startLogin = async () => {
    const verifier = randomString(32);
    const state = randomString(16);
    store.setItem('pkce_verifier', verifier);
    store.setItem('oauth_state', state);
    if (eventId) store.setItem('pending_event', eventId);
    const params = new URLSearchParams({
      response_type: 'code', client_id: cfg.clientId, redirect_uri: cfg.redirectUri,
      scope: 'openid email profile', code_challenge: b64url(await sha256(verifier)),
      code_challenge_method: 'S256', state,
    });
    location.assign(cfg.authorizeUrl + '?' + params.toString());
  };

  const finishLogin = async (code, state) => {
    if (!state || state !== store.getItem('oauth_state')) throw new Error('ログインの確認に失敗しました。もう一度お試しください。');
    const res = await fetch(cfg.tokenUrl, {
      method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({
        grant_type: 'authorization_code', client_id: cfg.clientId, code,
        redirect_uri: cfg.redirectUri, code_verifier: store.getItem('pkce_verifier') || '',
      }).toString(),
    });
    if (!res.ok) throw new Error('ログインに失敗しました。もう一度お試しください。');
    store.setItem('id_token', (await res.json()).id_token);
    store.removeItem('pkce_verifier'); store.removeItem('oauth_state');
  };

  const logout = () => {
    clearSession(); store.removeItem('pending_event');
    location.assign(cfg.logoutUrl + '?' + new URLSearchParams({ client_id: cfg.clientId, logout_uri: cfg.redirectUri }));
  };

  // ---- API ----
  const callApi = async (method, path, body) => {
    const res = await fetch(apiBase + path, {
      method, headers: { 'Authorization': store.getItem('id_token'), 'Content-Type': 'application/json' },
      body: body ? JSON.stringify(body) : undefined,
    });
    let data = {};
    try { data = await res.json(); } catch { /* 本文が無いとき */ }
    if (res.status === 401) {
      clearSession(); show('app', false); show('login', true);
      fatal('ログインの期限が切れました。もう一度ログインしてください。');
      throw new Error('ログインの期限が切れました。');
    }
    return { ok: res.ok, status: res.status, data };
  };

  const LABELS = [
    ['status', '状態'], ['resource_name', '名称'], ['resource_id', '対象のID'], ['detected_at', '検知日時'],
    ['operator', '変更した人'], ['diff', '変更内容'], ['reason', '申告の理由'], ['attested_by', '申告した人'],
    ['attested_at', '申告日時'], ['approved_by', '承認した人'], ['approved_at', '承認日時'],
  ];
  const STATUS_TEXT = { DETECTED: '検知済み（申告待ち）', ATTESTED: '申告済み（承認待ち）', APPROVED: '承認済み' };

  const renderEvent = (item) => {
    const box = $('detail'); box.textContent = '';
    for (const [key, label] of LABELS) {
      if (item[key] === undefined || item[key] === '') continue;
      const row = document.createElement('div'); row.className = 'row';
      const l = document.createElement('div'); l.className = 'label'; l.textContent = label;
      const v = document.createElement('div'); v.className = 'value';
      v.textContent = key === 'status' ? (STATUS_TEXT[item[key]] || item[key]) : item[key];
      if (key === 'status') v.classList.add('status');
      row.append(l, v); box.append(row);
    }
    show('event', true);

    // ボタンは、サーバーが「この人はできる」と返したときだけ出す（申告者本人には、承認のボタンを出さない）
    const v = item.viewer || {};
    show('attest', !!v.can_attest);
    show('approve', !!v.can_approve);
    const mine = !!item.reason && !!v.email && item.attested_by === v.email;
    $('mine-reason').textContent = mine ? item.reason : '';
    show('mine', mine);
    $('note-text').textContent = v.note || '';
    show('note', !!v.note && !v.can_attest && !v.can_approve);
    if (!v.can_attest) $('reason').value = '';
  };

  const loadEvent = async () => {
    show('event', false); show('attest', false); show('approve', false);
    const r = await callApi('GET', '/events/' + encodeURIComponent(eventId));
    if (!r.ok) { showMessage(r.data.message || '内容を取得できませんでした。', false); return; }
    renderEvent(r.data);
  };

  const submit = async (action, body, button) => {
    button.disabled = true;
    try {
      const r = await callApi('POST', '/' + action + '/' + encodeURIComponent(eventId), body);
      showMessage(r.data.message || (r.ok ? '完了しました。' : '失敗しました。'), r.ok);
      if (r.ok) await loadEvent();
    } catch (e) { showMessage(e.message, false); } finally { button.disabled = false; }
  };

  // ---- 一覧 ----
  const loadList = async () => {
    const box = $('list-body'); box.textContent = '読み込み中…'; show('list', true);
    const r = await callApi('GET', '/events');
    if (!r.ok) { box.textContent = ''; showMessage(r.data.message || '一覧を取得できませんでした。', false); return; }
    box.textContent = '';
    if (!r.data.events.length) { box.textContent = 'まだ検知はありません。'; return; }
    for (const e of r.data.events) {
      const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'item';
      const top = document.createElement('div'); top.className = 'top';
      const name = document.createElement('strong'); name.textContent = e.resource_name || e.resource_id || '';
      const chip = document.createElement('span'); chip.className = 'chip ' + (e.status || ''); chip.textContent = STATUS_TEXT[e.status] || e.status || '';
      top.append(name, chip);
      const sub = document.createElement('div'); sub.className = 'sub-text';
      sub.textContent = (e.detected_at || '') + '　' + (e.diff || '').trim();
      btn.append(top, sub);
      btn.addEventListener('click', () => openEvent(e.event_id));
      box.append(btn);
    }
  };

  // ---- 画面の切り替え（URLの ?event= で決まる。ブラウザの「戻る」にも対応する）----
  const route = () => {
    const q = new URLSearchParams(location.search).get('event');
    eventId = EVENT_ID.test(q || '') ? q : null;
    show('message', false);
    ['event', 'attest', 'approve', 'mine', 'note'].forEach((id) => show(id, false));
    if (eventId) {
      show('list', false); show('backbar', true);
      loadEvent().catch((e) => showMessage(e.message, false));
    } else {
      show('backbar', false);
      loadList().catch((e) => showMessage(e.message, false));
    }
  };
  const openEvent = (id) => { history.pushState(null, '', location.pathname + '?event=' + id); route(); };
  const goList = () => { history.pushState(null, '', location.pathname); route(); };

  // ---- 起動 ----
  const showApp = (token) => {
    const claims = parseJwt(token);
    $('who-email').textContent = claims.email || '';
    $('who-groups').textContent = [].concat(claims['cognito:groups'] || []).join(', ') || 'なし';
    show('login', false); show('app', true);
    route();
  };

  const main = async () => {
    const params = new URLSearchParams(location.search);

    if (params.get('code')) {            // ログインから戻ってきたとき
      try {
        await finishLogin(params.get('code'), params.get('state'));
      } catch (e) { clearSession(); fatal(e.message); show('login', true); return; }
      const pending = store.getItem('pending_event'); store.removeItem('pending_event');
      eventId = EVENT_ID.test(pending || '') ? pending : null;
      history.replaceState(null, '', location.pathname + (eventId ? '?event=' + eventId : ''));  // URLのcodeを消す
    } else if (params.get('error')) {
      fatal('ログインできませんでした: ' + (params.get('error_description') || params.get('error'))); show('login', true); return;
    } else {
      const q = params.get('event');
      eventId = EVENT_ID.test(q || '') ? q : null;
    }

    const token = validToken();
    if (!token) { show('login', true); return; }
    showApp(token);
  };

  $('login-btn').addEventListener('click', () => startLogin().catch((e) => fatal(e.message)));
  $('logout-btn').addEventListener('click', logout);
  $('back-btn').addEventListener('click', goList);
  window.addEventListener('popstate', () => { if (validToken()) route(); });
  $('open-btn').addEventListener('click', () => {
    const v = $('event-input').value.trim();
    if (!EVENT_ID.test(v)) { showMessage('通知のIDの形が違います。', false); return; }
    openEvent(v);
  });
  $('attest-btn').addEventListener('click', () => {
    const reason = $('reason').value.trim();
    if (!reason) { showMessage('理由を入力してください。', false); return; }
    submit('attest', { reason }, $('attest-btn'));
  });
  $('approve-btn').addEventListener('click', () => submit('approve', {}, $('approve-btn')));

  main().catch((e) => fatal(e.message));
})();
</script>
</body>
</html>
